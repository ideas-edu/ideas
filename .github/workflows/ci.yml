name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: [9.6.7, 9.10.3, 9.12.4]

    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 3.12.1.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgmp-dev libsqlite3-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}
      - run: cabal build all --enable-tests --enable-benchmarks
      - run: cabal test all
